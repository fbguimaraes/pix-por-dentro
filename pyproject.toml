[project]
name = "pix-por-dentro"
version = "0.1.0"
description = "Gerador de Pix copia e cola (BR Code estático) escrito do zero, seguindo os manuais do Banco Central."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "segno>=1.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.uv]
package = false
